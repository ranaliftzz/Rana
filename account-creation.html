<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Rana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    This screen is visually real but functionally fake: there is no
    authentication service and no backend behind it. Continue only checks
    that the fields look filled in and email-shaped, then navigates to the
    dashboard — nothing is sent anywhere, and no account or user record is
    actually created. Restyle only (PRD section 3) — the inert behavior is
    unchanged from the original build.
  -->
  <main class="screen">
    <h1>Create your account</h1>
    <p class="intro">Your plan is ready — create an account to save it.</p>

    <form>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
      </div>

      <button type="submit" class="btn-continue">Continue</button>

      <p id="account-status" class="status-message" aria-live="polite"></p>
    </form>

    <p class="intro" style="font-size: 0.8rem;">
      Rana is a training tool, not medical advice. Talk to a doctor before starting a new training or nutrition program, especially if you have an existing condition.
    </p>
  </main>

  <script src="account-creation.js" defer></script>
</body>
</html>
