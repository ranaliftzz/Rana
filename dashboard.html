<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Rana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen dashboard">

    <header class="hud-header">
      <div>
        <p id="dashboard-date" class="dashboard-date"></p>
        <h1 id="dashboard-greeting" class="hud-name"></h1>
      </div>
      <div style="text-align: right;">
        <p id="dashboard-tier" class="hud-tier"></p>
        <p id="dashboard-level" class="hud-level num"></p>
      </div>
    </header>

    <!-- Today's workout card. Deliberately minimal: day type + a start
         affordance only, no exercise list — that detail lives on the
         session detail screen (locked design decision #2 in CLAUDE.md). -->
    <section id="today-card" class="today-card" data-state="training">
      <p class="today-eyebrow">Today</p>
      <h2 id="today-type" class="today-type"></h2>
      <button id="today-start" class="today-start btn-continue" type="button">
        Start workout
      </button>
      <!-- Rest days are prescribed, not a gap — there is no "train anyway"
           path (locked design decision #1). -->
      <p id="today-rest-note" class="today-rest-note"></p>
    </section>

    <ul id="week-strip" class="week-strip"></ul>

  </main>

  <script src="data.js" defer></script>
  <script src="storage.js" defer></script>
  <script src="plan.js" defer></script>
  <script src="game.js" defer></script>
  <script src="dashboard.js" defer></script>
</body>
</html>
